name: Build Android Alpha

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Baixar projeto
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Configurar Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalar ferramentas Android
    run: |
      sdkmanager "platforms;android-34" \
        "build-tools;34.0.0" \
        "cmake;3.31.6" \
        "ndk;28.2.13676358"

  - name: Compilar APK experimental
    run: |
      export ANDROID_HOME="$ANDROID_SDK_ROOT"
      export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
      bash build_android.sh --debug

  - name: Publicar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: asura-wrath-alpha
      path: out/dist/asura_wrath_recomp_android.apk
      if-no-files-found: error
